<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Pick a Time | {brand}</title>
  <meta name="robots" content="noindex">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/styles.css">
  <script src="assets/config.js"></script>
  <script src="assets/funnel.js" defer></script>
</head>
<body class="funnel-page">
  <div class="wrap" style="max-width:900px;padding-top:40px;padding-bottom:40px">
    <div class="center" style="margin-bottom:24px">
      <span class="eyebrow">✓ You qualify. One step left</span>
      <h1 style="font-size:clamp(1.8rem,4vw,2.6rem)">Great news<span id="hello-name"></span>! Pick a time for your strategy call</h1>
      <p class="muted">20 minutes. We'll map out exactly who you should hire, what to pay them, and how fast we can fill the seats.</p>
    </div>
    <div id="calendar"></div>
    <p class="center muted" style="font-size:.9rem;margin-top:16px">Can't find a time that works? Email <a data-brand-email href="#"></a>.</p>
  </div>
</body>
</html>
